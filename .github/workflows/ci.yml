name: CI

# Vérifications exécutées sur chaque Pull Request vers main.
# Ce job est le contrôle requis pour merger (protection de branche).
on:
  pull_request:
    branches: [ main ]

env:
  # Version de Doxygen épinglée (EX-NFR-031, même esprit que EX-BUILD-010 pour Qt).
  # `apt-get install doxygen` livre la version de la distribution (1.9.x sur
  # ubuntu-latest), dont les règles de résolution de liens diffèrent de celles des
  # versions récentes : une documentation générée sans avertissement en local
  # échouait en CI. Poste de développement et CI doivent exécuter la MÊME version,
  # sinon la vérification locale ne prédit rien.
  DOXYGEN_VERSION: 1.16.1
  # Version de LLVM (clang-tidy, clang-format) épinglée pour la même raison que Doxygen : deux
  # versions majeures ne signalent/ne formatent pas identiquement, et un contrôle qui ne prédit
  # pas le résultat local ne sert qu'à agacer. Installer la même version en local pour que
  # `clang-tidy`/`clang-format` prédisent le verdict de la CI (LOT-58).
  LLVM_VERSION: 18.1.8
  # Version d'OpenCppCoverage épinglée, même raison que Doxygen/LLVM ci-dessus : le workflow
  # l'installait jusqu'ici sans version fixée (LOT-58).
  OPENCPPCOVERAGE_VERSION: 0.9.9.0
  # Seuil de couverture (LOT-58, TACHE-05) : cliquet anti-régression, pas un objectif. Valeur
  # PROVISOIRE posée sans mesure de référence locale (OpenCppCoverage n'a pas pu être installé sur
  # le poste ayant câblé ce job : l'installeur nécessite une élévation UAC indisponible dans cet
  # environnement). À RESSERRER sous la valeur réellement mesurée dès la première exécution de ce
  # job en CI — voir tache-05-couverture.md, section « État de la mesure ».
  COVERAGE_THRESHOLD_PERCENT: 20

jobs:
  build-test-coverage:
    # Épinglé : windows-latest (image 2025) ne fournit pas le générateur VS 2022.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Qt n'est pas gérable par FetchContent (SDK volumineux) : on le provisionne via aqtinstall
      # (action dédiée, avec cache). Nécessaire pour construire la cible éditeur Qt
      # (ProjectGaming, LOT-34) ; l'exécutable historique et les tests n'en dépendent pas.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure (CMake)
        # install-qt-action exporte QT_ROOT_DIR ; on le passe en CMAKE_PREFIX_PATH pour que
        # find_package(Qt6) résolve dans le preset vs.
        run: cmake --preset vs
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset vs

      - name: Test (CTest)
        run: ctest --preset vs

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        # Si Qt n'est pas résolu, la cible ProjectGaming est ignorée et le build « réussit » sans
        # produire d'application : une panne muette que seul ce contrôle rend visible.
        run: |
          $exe = 'build/vs/bin/Debug/ProjectGaming.exe'
          if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
          Write-Host "OK : $exe"

      - name: Install OpenCppCoverage ${{ env.OPENCPPCOVERAGE_VERSION }}
        run: choco install opencppcoverage --version=${{ env.OPENCPPCOVERAGE_VERSION }} -y --no-progress --allow-downgrade

      - name: Coverage (UnitTests + IntegrationTests + SystemTests, fusionnes)
        shell: pwsh
        # LOT-58 : le rapport précédent ne mesurait que UnitTests.exe -- les 89 tests d'intégration
        # et les 3 tests système (toute la physique de bout en bout, la franchissabilité des
        # niveaux livrés) en étaient absents, rendant le chiffre affiché faux par construction.
        # OpenCppCoverage n'accepte qu'un exécutable par invocation : chaque suite est exportée au
        # format binaire intermédiaire, puis les trois sont fusionnées (--input_coverage) en un
        # seul rapport agrégé.
        run: |
          $exe = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          $common = @(
            "--sources", "$env:GITHUB_WORKSPACE\Source",
            "--excluded_sources", "$env:GITHUB_WORKSPACE\Source\Test",
            "--excluded_sources", "$env:GITHUB_WORKSPACE\External"
          )
          & $exe @common --export_type "binary:unit.cov" -- "build\vs\bin\Debug\UnitTests.exe"
          & $exe @common --export_type "binary:integration.cov" -- "build\vs\bin\Debug\IntegrationTests.exe"
          & $exe @common --export_type "binary:system.cov" -- "build\vs\bin\Debug\SystemTests.exe"
          & $exe --input_coverage "unit.cov" --input_coverage "integration.cov" --input_coverage "system.cov" `
            --export_type "cobertura:coverage.xml" --export_type "html:coverage-html"

      - name: Seuil de couverture (LOT-58)
        shell: pwsh
        # Le seuil est un cliquet anti-régression, pas un objectif (voir tache-05-couverture.md) :
        # une chute EN DESSOUS fait échouer la CI, il n'est pas destiné à forcer une hausse.
        run: |
          [xml]$report = Get-Content coverage.xml
          $percent = [math]::Round([double]$report.coverage.'line-rate' * 100, 2)
          Write-Host "Couverture agregee (UnitTests+IntegrationTests+SystemTests) : $percent %"
          $threshold = ${{ env.COVERAGE_THRESHOLD_PERCENT }}
          if ($percent -lt $threshold) {
            Write-Error "Couverture $percent % sous le seuil $threshold % (EX-NFR-022, LOT-58)."
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-html/

  build-test-release:
    # Les deux jobs ci-dessus (et l'historique de la CI avant ce lot) ne construisent et ne testent
    # qu'en Debug. Le premier build Release avait lieu dans release.yml, DÉCLENCHÉ PAR LE TAG : une
    # casse Release-only (variable lue uniquement par une assertion, donc inutilisée sous NDEBUG,
    # cf. 90f85254) n'était découverte qu'après un tag public. Ce job la découvre en PR (LOT-58).
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure (CMake)
        run: cmake --preset vs
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Release)
        run: cmake --build --preset vs-release

      - name: Test (CTest, Release)
        run: ctest --preset vs-release

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        run: |
          $exe = 'build/vs/bin/Release/ProjectGaming.exe'
          if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
          Write-Host "OK : $exe"

  build-ninja:
    # Le preset `vs` s'appuie sur MSBuild, qui établit lui-même l'environnement MSVC ; le preset
    # `ninja` hérite au contraire de celui du terminal. N'étant couvert par aucun job, il avait
    # silencieusement cessé de fonctionner. Ce job garantit que les deux générateurs restent
    # utilisables — et vérifie au passage la détection automatique de Qt (via QT_ROOT_DIR).
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure, build et test (Ninja, environnement x64)
        shell: cmd
        # vcvars64.bat doit être appelé dans le MÊME processus que CMake : son effet est
        # l'environnement du shell, que `run` ne conserve pas d'une étape à l'autre. vswhere
        # localise l'installation sans coder en dur l'édition de Visual Studio de l'image.
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake --preset ninja || exit /b 1
          cmake --build --preset ninja || exit /b 1
          ctest --preset ninja || exit /b 1

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        # Sans Qt, la cible ProjectGaming est ignorée et le build « réussit » sans exécutable :
        # c'est exactement la panne que ce lot corrige, donc on l'érige en contrôle.
        run: |
          $exe = 'build/ninja/bin/ProjectGaming.exe'
          if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
          Write-Host "OK : $exe"

  sanitize:
    # ENABLE_ASAN existe depuis le LOT-01 et n'etait cable dans aucun workflow : EX-NFR-003
    # (empreinte memoire, verifiable via AddressSanitizer) etait orpheline. Ce job instrumente les
    # trois executables de test (jamais l'application Qt/D3D11, injouable sans affichage) et les
    # execute -- meme etablissement de l'environnement MSVC que build-ninja (LOT-58).
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure et build (Ninja, ASan, sans l'editeur Qt)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake -S . -B build/ninja-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_EDITOR_QT=OFF || exit /b 1
          cmake --build build/ninja-asan || exit /b 1

      - name: UnitTests sous AddressSanitizer
        shell: cmd
        run: build\ninja-asan\bin\UnitTests.exe || exit /b 1

      - name: IntegrationTests sous AddressSanitizer
        shell: cmd
        run: build\ninja-asan\bin\IntegrationTests.exe || exit /b 1

      - name: SystemTests sous AddressSanitizer
        shell: cmd
        run: build\ninja-asan\bin\SystemTests.exe || exit /b 1

  clang-tidy:
    # .clang-tidy est complet depuis le debut du projet et n'etait execute nulle part (LOT-58) :
    # conventions.md le presentait comme de l'outillage « en place », a tort. Analyse ciblee sur le
    # DIFF de la PR (pas tout le depot) : la dette existante (jamais passee au crible) ne bloque
    # personne, et le cout de ce job ne croit pas avec la taille du depot. Seule bugprone-* est
    # bloquante (WarningsAsErrors dans .clang-tidy, apres triage -- voir tache-03) ; les autres
    # familles (cppcoreguidelines-*, modernize-*, performance-*, readability-*) restent visibles
    # dans les logs sans faire echouer le job : un triage complet est hors budget de ce lot.
    # windows-2022 (pas Linux) : le code inclut Direct3D 11/Windows.h, indisponibles sous Linux.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install LLVM (clang-tidy) ${{ env.LLVM_VERSION }}
        run: choco install llvm --version=${{ env.LLVM_VERSION }} -y --no-progress --allow-downgrade

      - name: Configure (Ninja, compile_commands.json, sans PCH)
        # ENABLE_PCH=OFF : le fichier .pch genere par MSVC n'est pas un format que clang-tidy sait
        # lire, l'analyse echouerait sur chaque fichier avec un message qui ne parle pas de PCH.
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake -S . -B build/ninja-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_PCH=OFF || exit /b 1
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: clang-tidy sur les fichiers modifies par la PR
        shell: pwsh
        # Diff contre la base de la PR : seuls les fichiers Source/*.cpp (hors Source/Test) reellement
        # touches sont analyses. --diff-filter=ACMR exclut les fichiers supprimes (sinon clang-tidy
        # echouerait a les trouver).
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          $files = git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'Source/*.cpp' |
            Where-Object { $_ -notmatch '^Source/Test/' }

          if (-not $files) {
            Write-Host "Aucun fichier Source/*.cpp modifie par cette PR : rien a analyser."
            exit 0
          }

          Write-Host "Fichiers analyses :`n$($files -join "`n")"
          $clangTidy = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          $failed = $false
          foreach ($f in $files) {
            & $clangTidy -p build\ninja-tidy --extra-arg=-Wno-unused-command-line-argument $f
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) {
            Write-Error "clang-tidy : au moins une violation bloquante (bugprone-*)."
            exit 1
          }

  format:
    # CONTRIBUTING.md exige un code formate (clang-format) avant tout commit depuis le debut du
    # projet ; rien ne le verifiait (LOT-58). Controle, jamais reecriture : le job signale, il ne
    # pousse pas de commit de reformatage. Sur Linux (contrairement a clang-tidy) : clang-format
    # n'a pas besoin des en-tetes Direct3D/Windows, seulement du texte source.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format ${{ env.LLVM_VERSION }}
        # Le paquet PyPI redistribue les binaires officiels LLVM : meme mecanisme et memes
        # garanties de version que le job clang-tidy (LOT-58), sans installer tout LLVM.
        run: pip install "clang-format==${{ env.LLVM_VERSION }}"

      - name: Verifier le formatage (Source/, hors External/)
        run: |
          clang-format --version
          git ls-files 'Source/*.cpp' 'Source/*.h' | xargs clang-format --dry-run --Werror --style=file

  lint-exigences:
    # Contrôle du référentiel d'exigences (EX-...) : unicité des déclarations et
    # absence de référence orpheline. Léger et portable (Python), donc sur Linux.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint des identifiants d'exigences
        run: python3 scripts/lint_exigences.py

      - name: Cahier de test a jour
        run: python3 scripts/generate_cahier_test.py --check

      - name: Sequence de niveaux demo (LOT-25) synchronisee
        run: python3 scripts/check_demo_sequence.py

  docs:
    # Génère la documentation Doxygen (garde-fou WARN_AS_ERROR) pour valider la
    # doc dès la PR, avec la même version de Doxygen que le déploiement (docs.yml).
    # Évite qu'une doc cassée n'atteigne main où seul docs.yml la construisait.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          set -euo pipefail
          tag="Release_${DOXYGEN_VERSION//./_}"
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          # Extrait hors du dépôt (RUNNER_TEMP) : le workspace reste propre.
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/${tag}/${archive}"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Doxygen version
        run: doxygen --version

      - name: Generate documentation
        run: python3 scripts/build_docs.py
