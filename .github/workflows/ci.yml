name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake --preset vs

      - name: Build
        run: cmake --build --preset vs

      - name: Test (CTest)
        run: ctest --preset vs
